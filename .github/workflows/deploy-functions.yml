name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy reminders and recovery
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: egpfdyvksqierfdkogwe
        run: |
          supabase functions deploy reminders --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy recovery --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
