  - {item: Heading Indicator, response: CHECKED}
  - {item: Turn Coordinator, response: CHECKED}
  - {item: Attitude Indicator, response: STEADY}
  - {item: Compass, response: SWINGING FREELY}
  - {item: Anti-Skid, response: ON / CHECKED, tags: [jet]}
  - {item: Rudder Bias, response: CHECKED, tags: [jet]}
  - {note: RUDDER BIAS FAIL → NO DISPATCH, tags: [jet]}
