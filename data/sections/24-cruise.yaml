# Pick list: CRUISE
# Part of checklist-builder. Edit, then open a pull request. See docs/CHANGE_MANAGEMENT.md
title: CRUISE
order: 24
when: Level at cruise altitude      # shown under the section heading
default_section: all      # included in an aircraft's standard default checklist: all | turbine | jet | press | retract | twin
items:
  - {item: Power / Throttles, response: SET, default: true}
  - {item: Mixture, response: LEANED, tags: [piston], default: true}
  - {item: Cowl Flaps, response: CLOSED, tags: [piston]}
  - {item: Propeller, response: CRUISE RPM, tags: [piston, turboprop]}
  - {item: Engine Instruments, response: MONITOR, default: true}
  - {item: Fuel Quantity / Burn, response: MONITOR, default: true}
  - {item: Fuel Selector / Crossfeed, response: AS REQUIRED}
  - {item: Fuel Balance, response: CHECKED, default: true}
  - {item: Pressurization, response: CHECKED / FIELD ELEV SET, tags: [press], default: true}
  - {item: Oxygen, response: AS REQUIRED}
  - {item: Anti-Ice / De-Ice, response: AS REQUIRED, default: true}
  - {item: Exterior Lights, response: AS REQUIRED}
  - {item: Altimeter, response: SET, default: true}
  - {item: Autopilot, response: AS REQUIRED, default: true}
  - {item: Destination Weather, response: CHECKED}
  - {item: Engine Sync, response: 'ON', tags: [twin]}
  - {item: Heading Indicator, response: ALIGNED}
  - {item: True Airspeed, response: VERIFIED}
  - {item: Groundspeed / ETA, response: CHECKED}
  - {item: Position Reports / Flight Following, response: AS REQUIRED}
