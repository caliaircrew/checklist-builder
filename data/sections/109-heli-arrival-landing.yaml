# Part of checklist-builder. Edit, then open a pull request. See docs/CHANGE_MANAGEMENT.md
# Helicopter pick list: general items for single- and twin-engine piston and turbine helicopters.
# Values that differ by model say PER RFM. Always verify against the Rotorcraft Flight Manual (RFM/POH).
title: ARRIVAL AND LANDING
order: 109
category: helicopter
default_section: all
items:
  - {item: Landing Site Recon (high / low), response: COMPLETE, default: true}
  - {item: Wind Direction, response: DETERMINED, default: true}
  - {item: 'Obstacles / Wires', response: CHECKED, default: true}
  - {item: Approach Path, response: CLEAR / ESCAPE ROUTE PLANNED, default: true}
  - {item: Carburetor Heat, response: AS REQUIRED, tags: [piston], default: true}
  - {item: Rotor & Engine RPM, response: GREEN, default: true}
  - {item: Lights, response: ON, default: true}
  - {item: Passengers, response: BRIEFED, default: true}
  - {note: AVOID VORTEX RING STATE — WATCH RATE OF DESCENT AT LOW AIRSPEED}
