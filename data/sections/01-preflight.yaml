  - {item: Warning Systems Rotary Test, response: COMPLETE, tags: [jet], default: true}
  - {item: Fire Warning System Test, response: COMPLETE, tags: [turbine], default: true}
  - {note: FIRE WARNING TEST FAIL → NO DISPATCH, tags: [turbine], default: true}
