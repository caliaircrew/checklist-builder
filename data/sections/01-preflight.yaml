  - {item: Exterior Inspection, response: COMPLETE, default: true}
  - {item: Interior Inspection, response: COMPLETE}
  - {item: Documents (ARROW), response: ON BOARD, default: true}
  - {item: Flight Release / Trip Sheet, response: RECEIVED}
  - {item: Weather / NOTAMs, response: REVIEWED}
  - {item: Weight & Balance, response: COMPUTED, default: true}
  - {item: Takeoff Performance Data, response: COMPUTED, default: true}
  - {item: Fuel Quantity, response: CHECKED / CONFIRMED, default: true}
