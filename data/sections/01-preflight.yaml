  - {item: Oil Quantity, response: CHECKED}
  - {item: Control Lock / Gust Lock, response: REMOVED, default: true}
  - {item: Pitot Covers / Plugs, response: REMOVED}
  - {item: Tie-downs / Chocks, response: REMOVED}
  - {item: Tow Bar, response: REMOVED}
  - {item: Torque Link Pin, response: CONNECTED, tags: [jet]}
  - {item: Parking Brake, response: SET, default: true}
  - {item: Circuit Breakers, response: CHECKED IN, default: true}
  - {item: Switches, response: OFF / SET}
