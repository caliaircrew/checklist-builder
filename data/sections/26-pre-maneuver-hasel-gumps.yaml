  - {item: Gas, response: ADEQUATE / FULLEST TANK}
  - {item: Undercarriage, response: SET FOR MANEUVER, tags: [retract]}
  - {item: Mixture(s), response: FULL RICH, tags: [piston]}
  - {item: Props, response: AS REQUIRED FOR MANEUVER, tags: [piston, turboprop]}
  - {item: Switches, response: LIGHTS & FUEL PUMPS ON}
  - {item: Emergency Landing Field, response: LOCATED}
  - {item: Entry Altitude & Heading, response: SET / BUGGED}
  - {item: Practice Area / CTAF, response: ANNOUNCED}
