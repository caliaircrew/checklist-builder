# Pick list: BEFORE START
# Part of checklist-builder. Edit, then open a pull request. See docs/CHANGE_MANAGEMENT.md
title: BEFORE START
order: 8
default_section: all      # included in an aircraft's standard default checklist: all | turbine | jet | press | retract | twin
items:
  - {item: Passenger Briefing, response: COMPLETE, default: true}
  - {item: Seats / Belts / Harnesses, response: SECURE, default: true}
  - {item: Cabin Door, response: CLOSED & LOCKED, default: true}
  - {item: Door Annunciators, response: OUT, tags: [turbine], default: true}
  - {item: Windows, response: CLOSED & LOCKED}
  - {item: Baggage Doors, response: SECURE}
  - {item: Chocks, response: REMOVED}
  - {item: Parking Brake, response: SET}
  - {item: Brakes, response: TEST & SET, default: true}
  - {item: Circuit Breakers, response: IN}
  - {item: Fuel Selector, response: ON / BOTH, tags: [piston], default: true}
  - {item: Fuel Shutoff Valves, response: OPEN}
  - {item: Fuel Boost Pumps, response: AS REQUIRED}
  - {item: Fuel Quantity / Balance, response: CHECKED}
  - {item: Electrical Equipment, response: 'OFF'}
  - {item: Avionics, response: 'OFF'}
  - {item: Beacon, response: 'ON', default: true}
  - {item: Nav Lights, response: 'ON'}
  - {item: Passenger Safety / Seat Belt Sign, response: 'ON', tags: [turbine], default: true}
  - {item: Cowl Flaps, response: OPEN, tags: [piston]}
  - {item: Carburetor Heat, response: COLD, tags: [piston]}
  - {item: Propeller Area, response: CLEAR, tags: [piston, turboprop], default: true}
  - {item: Mixture, response: RICH / AS REQUIRED, tags: [piston], default: true}
  - {item: Propeller, response: HIGH RPM, tags: [piston, turboprop]}
  - {item: Throttle, response: OPEN 1/4 INCH, tags: [piston], default: true}
  - {item: Ignition Switches, response: NORM, tags: [turbine], default: true}
  - {item: GPU, response: CONNECTED / AS REQUIRED, tags: [turbine]}
  - {item: Generators, response: OFF FOR GPU START, tags: [turbine]}
  - {item: APU, response: START / AS REQUIRED, tags: [jet]}
  - {item: APU Bleed, response: AS REQUIRED, tags: [jet]}
  - {item: Annunciator Panel, response: CHECKED}
  - {item: ATIS, response: RECEIVED}
  - {item: Clearance, response: RECEIVED}
  - {item: Flood / Panel Lights, response: AS REQUIRED}
  - {item: Trip Release, response: CONFIRMED, tags: [turbine]}
  - {item: Key, response: IN IGNITION, tags: [piston]}
  - {item: Positive Exchange of Controls, response: BRIEFED}
  - {item: Emergency Egress / Egress Hammer, response: BRIEFED}
  - {item: Fuel Selector, response: CYCLE / FULLEST TANK, tags: [piston]}
  - {item: Alternate Air, response: CLOSED, tags: [piston]}
  - {item: Alternate Static Source, response: 'OFF'}
  - {item: Strobe / Anti-Collision, response: 'ON'}
