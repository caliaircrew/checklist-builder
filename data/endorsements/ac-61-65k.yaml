      proficiency and safety on the maneuvers and procedures required by 14 CFR § 61.87 in this or similar make and
      model of aircraft to be flown.
  - id: A.5
    category: Student pilot
    title: Pre-solo flight training at night
    regulation: 14 CFR § 61.87(o)
    ac_page: A-8
    status: faa
    validity: 90d
    text: I certify that [First name, MI, Last name] has received flight training at night on night flying procedures
      that include takeoffs, approaches, landings, and go-arounds at night at the [airport name] airport where the
      solo flight will be conducted; navigation training at night in the vicinity of the [airport name] airport where
      the solo flight will be conducted. This endorsement expires 90 calendar days from the date the flight training
      at night was received.
