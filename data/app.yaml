changelog:
  - version: '1.41'
    notes:
      - "Crew profiles: home airport shown with its city (e.g. KVNY · Van Nuys, CA), a flight-time summary (total, PIC, turbine, helicopter), aircraft split into Flying now and Previously flown, and a contract day rate"
      - "New tap-to-choose sections for flight attendants (training, recurrent, CPR, food safety, skills), mechanics (certificates, engines, specialties, AOG) and helicopter pilots (turbine/piston time, NVG, long line, missions, SFAR 73)"
      - "Find crew: filter by contract day rate; results show city and day rate"
  - version: '1.40'
    notes:
      - "Fix: the checklist builder page works again (1.39 accidentally published the Terms page at /checklists)"
      - "Helicopters: picking a helicopter now loads a helicopter checklist (preflight to shutdown, piston or turbine items to match), and the pick lists and section buttons show helicopter lists"
      - "Endorsements: SFAR 73 (Robinson R22/R44) ground training, PIC, annual review, solo and flight review (drafts from the 2024 rule)"
  - version: '1.39'
    notes:
      - "New Partners page (caliaircrew.com/partners): sponsored partner listings by category and a Become a partner inquiry form that goes to the admin page"
      - "Terms of Use and Privacy Policy drafts (marked 'Draft for attorney review, not yet in effect'), linked from every footer with a Contact link"
  - version: '1.38'
    notes:
      - "Account: confirm your backup email with a code. Sign-in box: 'Locked out of your email? Use your backup email' makes your confirmed backup your new sign-in email (switches on after a one-time setup)"
  - version: '1.37'
    notes:
      - "Checklist builder has the Cali Aircrew look: clear-sky colors, the site's top bar and menu (Checklists, Crew, Partners, My profile), the same fonts and buttons, navy section bars while editing, and the phone tab bar. The printed card is unchanged"
      - "One Sign in button: the site bar's Sign in opens sign-in right in the builder, so you stay on your checklist; once signed in, the builder shows your sync status"
  - version: '1.36'
    notes:
      - "New Account page (My profile → Account): change your sign-in email, turn Microsoft Authenticator on or off, save recovery contacts (backup email and phone), download your data, or delete your account"
      - "Sign-in box: 'Can't get in? Ask Cali Aircrew' sends a help request to the admins"
      - "Admin: sign-in help requests under Requests, and members' recovery contacts in Users"
  - version: '1.35'
    notes:
      - "Admin: the FAA registry button now opens the FAA Airmen Inquiry on iPad and iPhone, copies the pilot's legal last name, and lists what to type"
  - version: '1.34'
    notes:
      - "Admins' own profile text goes public right away instead of also waiting for review; the review list ignores waiting text that already matches the public text"
  - version: '1.33'
    notes:
      - "Homepage: the top button says My profile when you're signed in (Sign in when you're not), and admins see an Admin link"
      - "Admins get an Admin button at the top of their crew and operator profile pages"
  - version: '1.32'
    notes:
      - "Crew profile: private FAA verification section (legal name and the city and state on your FAA address). Only you and Cali Aircrew admins see it; it's never shown on your profile"
      - "Admin review shows these details next to the FAA registry button, which now copies the legal last name"
  - version: '1.31'
    notes:
      - "Operator profiles: owners, charter operators and flight departments list the aircraft they operate (and how many), their base, and the crew they need, with a Private owner option and recommended crew matched to their aircraft"
      - "Pilots: new Operators tab in the directory, 'Operators flying it' on every aircraft page, and operator counts in Browse by aircraft"
      - "Admin: operator profiles are reviewed separately, with flags for phone numbers or emails in their text, plus operator numbers on the dashboard"
  - version: '1.30'
    notes:
      - "Admin page at caliaircrew.com/admin (admins only): dashboard with business metrics, review queue with automatic quality flags and FAA registry shortcut, bulk approve, users (lost-phone reset, admin access, delete), Get-notified list with spreadsheet download, aircraft and privacy requests, announcement banner and partner listings, audit log, and backup download"
      - "Crew profiles: changes to the free-text box are reviewed before they show publicly; pilots can request a missing aircraft"
  - version: '1.29'
    notes:
      - "Crew profile: when you tick Current on an aircraft, add Current through (month and year) and Training school: FlightSafety, CAE (SimuFlite), SIMCOM, LOFT (Carlsbad), Manufacturer / factory, Company in-house, Independent instructor, or Other with the name"
      - "Profiles and search show 'current through Mar 2027 · LOFT'. After that month passes, it shows 'currency expired' and no longer counts as current in searches"
  - version: '1.28'
    notes:
      - "Crew profile: a Current checkbox on each aircraft. It shows as 'current' on profiles and results, and crew current on the searched aircraft are listed first"
  - version: '1.27'
    notes:
      - "Find crew: new quick link and filter 'Now or with notice'; results list available-now crew first, then available with notice; 'Available with notice' badge on results and profiles"
  - version: '1.26'
    notes:
      - "Find crew is open: search by aircraft, crew type, region and certificate, with quick links (Contract pilots, Available now, Part 135 current, CFIs, Helicopter pilots). On a computer or iPad in landscape, tap a result to see the profile beside the list"
      - "Browse by aircraft: aircraft with listed crew and how many, by category and manufacturer; each aircraft has its own page with its crew and a Build a checklist button that opens the builder with that aircraft picked"
      - "Homepage: Find crew and Browse crew by aircraft are live; the popular aircraft tiles open their aircraft pages"
  - version: '1.25'
    notes:
      - "Crew profile is now mostly taps: role, certificate, ratings, FAA medical, crew type, home region and airport, availability status, what you're looking for, travel, passport, experience and languages. One optional text box at the end"
  - version: '1.24'
    notes:
      - "47 helicopters added (Robinson, Bell, Airbus Helicopters, Leonardo, Sikorsky, Schweizer, MD, Enstrom, Guimbal, Kaman and classics), with a Helicopters category in the crew profile. Helicopter checklist defaults come next"
      - "Aircraft search ignores dashes and spaces: PC12 finds the PC-12, CJ3, R44, AW139 and nicknames like AStar or Huey work too"
      - "Crew profile: mark each aircraft Part 135 current as SIC or PIC; profiles with any 135 currency show a Part 135 current badge"
  - version: '1.23'
    notes:
      - "Checklist builder: Home button (and the title) take you back to the Cali Aircrew homepage"
      - "Homepage Sign in now opens your account and crew profile; it is the same sign-in as the checklist builder"
  - version: '1.22'
    notes:
      - "Crew profile: Browse the list to add aircraft by tapping. Pick a category (Jets, Turboprops, Piston twins, Piston singles), then a manufacturer, then tap each model you fly. Typing a name still works too"
  - version: '1.21'
    notes:
      - "Crew profiles are open: caliaircrew.com/crew → My profile. Add your crew type, certificate, home base, the aircraft you fly with hours and type ratings, availability and a short bio, with a live preview beside the form on an iPad in landscape or a computer"
      - "Publishing sends a profile for review; it appears in the directory once Cali Aircrew approves it. Same sign-in as the checklist builder"
  - version: '1.20'
    notes:
      - "New Cali Aircrew homepage in the clear-sky look: 'Find the right pilot for every aircraft, and the right tool for the job.' Crew directory sections are marked Coming soon with a Get notified sign-up"
  - version: '1.19'
    notes:
      - "Homepage name updated to Cali Aircrew"
  - version: '1.18'
    notes:
      - "New Cali Aircrew homepage. The Checklist Builder now lives at /checklists/ (your saved checklists and sign-in are unchanged)"
  - version: '1.17'
    notes:
      - "Cleaner top of the page: the big My checklists box is gone, so Step 1 (aircraft search, the blue aircraft box and Reset to default) is first again"
      - "One 📁 dropdown at the top does it all: tap a checklist to switch, ＋ New checklist, or Rename, duplicate, delete, back up… for the rest"
      - "Saved / synced status now shows at the top of Step 1"
  - version: '1.16'
    notes:
      - "Sign-in: the email now arrives with a sign-in link; tap it on the device you're using and the page opens signed in. A 6-digit code box is still there for when code emails are turned on"
  - version: '1.15'
    notes:
      - "Optional sign-in (👤 Sign in, top of the screen): enter your email, type the 6-digit code we send, and your checklists and ★ My items sync to every device you sign in on. No passwords. Without signing in, everything still works on this device"
      - "Optional two-step sign-in with Microsoft Authenticator (Your account → Turn on): after the email code, you also type the code from the app"
      - "Works offline: each device keeps its own copy and catches up when it's back online. If the same checklist was changed on two devices, the most recent change wins"
      - "Your account panel: Sync now, turn two-step sign-in on or off, sign out, or sign out and remove your checklists from a shared device"
  - version: '1.14'
    notes:
      - "New: 📁 My checklists. Keep as many checklists as you like on each device, each with your own name (tail number, aircraft, club). Switch between them, duplicate one to start a similar airplane, or delete old ones. Everything saves automatically and works offline. A 📁 dropdown at the top of the screen switches between them from anywhere"
      - "Back up all checklists / Restore: move every checklist and your ★ My items to another device in one file. Restoring adds new checklists and updates older copies, and never deletes anything"
      - "Tail number field; it prints on the card next to the aircraft type"
      - "Fixed: the Find your aircraft search box is now full width on phones"
      - "Opening a single checklist file now adds it as a new checklist instead of replacing the one on screen"
  - version: '1.13'
    notes:
      - "The big jets: Boeing 707, 727, 737 (Original, Classic, NG, MAX 8/9), 747 (-100 through -8), 757, 767, 777 (-200, -200ER, -200LR, -300, -300ER, 777F) and 787-8/9/10; Airbus A300, A310, A318 through A321 and the neo family, A330 and A330neo, A340, A350-900/1000 and A380; plus DC-8, DC-10, MD-11, L-1011 TriStar, Concorde and COMAC C919. Like the regional types, these are for study and flow practice"
  - version: '1.12'
    notes:
      - "About 140 more aircraft (now about 575), including regional jets and turboprops for airline-track students: CRJ100 to CRJ1000, ERJ-135/140/145, E170 to E195 and E2, A220, 717, MD-80/90, BAe 146/Avro RJ, ATR 42/72, Dash 7 and Dash 8/Q400, Saab 340/2000, Brasilia, Jetstream 41, Fokker, Dornier 228/328. Airlines fly these from company checklists, so cards made here are for study and flow practice"
      - "Also new: Seminole DX and Cirrus G7+ with Autoland (current training fleets), more Cessna, Piper, Beech and Mooney variants, light-sport trainers, aerobatic and kit aircraft, warbirds and classic taildraggers"
      - "Fixed: the Columbia / Cessna 350-400 Corvalis / TTx is now listed with fixed landing gear; MU-2 short-body entry renamed"
  - version: '1.11'
    notes:
      - "Over 200 more aircraft (now about 430), including each Cirrus SR20/SR22/SR22T generation and Vision Jet, every Pilatus PC-12 version plus PC-7/PC-9, the TBM 700 through 960, Piper M-class and Malibu/Matrix, King Air variants from the C90 to the 360, Learjet, Global, Gulfstream, Falcon and Hawker variants, Phenom/Praetor, ACJ and BBJ, plus a deep set of aerobatic, training, light-sport, warbird, amphibian and kit aircraft"
      - "Cirrus SR22 generations, the Cessna 172S and Archer/Pilot 100i variants now load their suggested model checklists"
  - version: '1.10'
    notes:
      - "About 60 more aircraft in Find your aircraft (now about 210): taildraggers and bush planes (Husky, Citabria, Decathlon, Scout, Maule, Carbon Cub, Helio Courier, Beaver, Otter), aerobatic (Pitts, Extra), trainers (Grumman AA-1/AA-5, Beech Skipper, Tecnam, Socata TB), amphibians (Icon A5, Lake), classic and utility twins (Twin Beech, Twin Bonanza, Travel Air, Queen Air, Aerostar, Islander, P68, Twin Otter), turboprops (King Air 100, Starship, Cheyenne III/400, Epic E1000, Merlin/Metro, PC-6, Air Tractor) and jets (Hawker 4000, Gulfstream G100–G700, Falcon 6X, Westwind, Sabreliner, JetStar, Nextant)"
  - version: '1.09'
    notes:
      - "20 new pick lists drawn from university and flight-school checklists (OU, Embry-Riddle, ATP, Middle Georgia State, Dubuque, Cirrus training): Airworthiness / Inspections Due; a five-zone Walkaround (Cockpit, Right Wing, Nose/Engine, Left Wing, Fuselage/Empennage); Pre-Taxi / Avionics Setup; Engine Run-Up; Takeoff Briefing; Initial Climb; Pre-Maneuver (HASEL/GUMPS); Clearing Turns; Maneuver Setup; In-Range; Pattern Entry / Downwind; Post-Flight / Leaving the Aircraft"
      - "Reference blocks for the printed card: V-speeds, frequencies, transponder codes and phone numbers (fill in your own values; printed without line numbers)"
      - "New 'when' line under each section heading, e.g. Initial Climb — Between 500 and 1,500 ft AGL; edit it in each section and it prints under the black bar"
      - "More items in existing lists: maintenance time remaining, Hobbs/billing time, type of takeoff and landing, takeoff/landing time, speeds briefing, positive exchange of controls, S.A.F.E.T.Y. passenger briefing, twin second-engine start, and more"
      - "Pick lists now run in flight order, 48 in all"
  - version: '1.08'
    notes:
      - "Every aircraft now has a default checklist: the ⭐ suggested model checklist where one exists, otherwise a standard checklist built from the general lists for that aircraft's engine type, gear, pressurization and number of engines"
      - "Picking an aircraft fills every section with its default (it asks first only if you have edited your lines). Reset to default, at the top and in Step 2, puts the checklist back to that aircraft's default at any time"
      - "New: ★ My items. Lines you add can be saved to your own pick list for that section (only on your device). They appear at the top of Pick items from list, survive Reset, and travel with Save checklist file. Use ⋯ to save or remove any line"
      - "Standard defaults are labeled as not yet specific to the model's POH until a pilot checks them against the manual"
      - "Fixed: caution notes in the pick lists now follow the aircraft type"
      - "Fixed: the ⋯ button on a line sometimes did nothing after using it on another line"
  - version: '1.07'
    notes:
      - "The site is now built automatically from the caliaircrew GitHub repository; every change is checked before it goes live"
  - version: '1.06'
    notes:
      - 'New: CFI endorsements. All 96 sample endorsements from FAA AC 61-65K (Nov 14, 2025) plus the § 61.195(h) recommending-instructor statement'
      - Fill in instructor and pilot once; names, certificate numbers, make/model and dates drop into each endorsement; type the remaining blanks in place
      - Shows how long solo, flight review and similar endorsements stay valid; downloads a Word file with signature lines in the AC format (RE or Exp. date)
  - version: '1.05'
    notes:
      - '11 new section lists: Passing 10,000 (climb), Flight levels / RVSM, High-altitude oxygen, Cruise check (periodic), Transition level (descent), Below 10,000 (descent), Final / stabilized approach, Go-around / missed approach, Quick turn / through-flight, Cold weather / deicing, Briefings'
  - version: '1.04'
    notes:
      - 'Aircraft list expanded to about 150 models: Piper, Beechcraft, Cirrus, Mooney, Diamond, Pilatus, Daher, Kodiak, Embraer, Gulfstream, Falcon, Learjet, Global, Hawker, HondaJet, Eclipse, Avanti, MU-2, Twin Commander'
      - 'New suggested checklists (draft): Cirrus SR22 / SR22T and Piper PA-28-181 Archer'
      - Each suggested checklist now shows its review status (Draft or Reviewed by / date)
  - version: '1.03'
    notes:
      - Suggested model checklists (⭐) for the Challenger 605, Citation XLS/XLS+, Citation CJ3/CJ3+ and Cessna 172S — load the whole checklist in one tap, or pick items section by section
      - Suggested items are clearly marked as suggestions, not FAA-approved; first-flight-of-day items come pre-boxed
  - version: '1.02'
    notes:
      - 'Find your aircraft: search Cessna, Citation and Challenger models from 1950 on; picking one fills in the aircraft name and sets the pick lists to match (piston/turboprop/jet, twin, gear, pressurization)'
  - version: '1.01'
    notes:
      - Version number shown on the builder, with this What's New list
      - Checklist version field and a New revision button (bumps the version and sets today's date); the version prints in the page header
      - 'Easier reordering: drag a line by its ⠿ handle, or tap its number and type a new one'
  - version: '1.00'
    notes:
      - Pick items from ready-made lists for every section, filtered by aircraft type
      - Add your own lines and sections
      - Standard (two sections across) and Large print layouts
      - Download as a Word file; save and open checklist files
